name: Build Android APK (qwertybot)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Tombol manual "Run workflow" di GitHub Actions tab

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Ensure Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Root Dependencies
        run: |
          npm install

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Install Global Capacitor CLI
        run: |
          npm install -g @capacitor/cli

      - name: Build Web Frontend (Vite)
        run: |
          cd client
          npm run build

      - name: Copy & Sync Web Assets to Android
        run: |
          mkdir -p client/android/app/src/main/assets/public
          cp -r client/dist/* client/android/app/src/main/assets/public/
          cd client
          npx @capacitor/cli sync android || true

      - name: Set Executable Permission for Gradlew
        run: |
          chmod +x client/android/gradlew

      - name: Compile Android APK (assembleDebug)
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace -x lint -x test

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp client/android/app/build/outputs/apk/debug/app-debug.apk output/qwertybot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwertybot-apk
          path: output/qwertybot.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Qwertybot Android APK v1.0.0"
          body: |
            ### 📱 Qwertybot Android App Direct Download
            
            Unduh file APK langsung (format .apk, bukan .zip) dan pasang di HP Android kamu:
            - **qwertybot.apk**
          files: output/qwertybot.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
